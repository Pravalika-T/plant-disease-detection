<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plant Disease Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-leaf text-success fs-3"></i>
                <span>Plant Health AI</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div id="navUserArea" class="w-100 d-flex flex-column flex-lg-row align-items-lg-center justify-content-lg-between"></div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="card-icon-box mx-auto mb-2"><i class="fas fa-user-lock"></i></div>
                        <h2 class="fw-bold text-success">Welcome Back</h2>
                        <p class="text-muted">Login to check your plant health records</p>
                    </div>

                    <div id="alertMessage" class="d-none"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" id="email" class="form-control form-control-lg fs-6" placeholder="farmer@example.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="password" class="form-control form-control-lg fs-6" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" id="loginBtn" class="btn btn-agri-primary btn-lg fs-6">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </button>
                            <a href="register.html" class="btn btn-agri-secondary btn-lg fs-6 text-center">
                                <i class="fas fa-user-plus me-2"></i>Create Account
                            </a>
                        </div>
                    </form>
                    <div class="mt-4 p-3 bg-light rounded-3 text-center border">
                        <small class="text-muted d-block fw-semibold mb-1">Demo Credentials:</small>
                        <small class="text-dark d-block">Farmer: farmer@plantdisease.com | farmer123</small>
                        <small class="text-dark d-block">Admin: admin@plantdisease.com | admin123</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
