<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction History - Plant Health AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-leaf text-success fs-3"></i>
                <span>Plant Health AI</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div id="navUserArea" class="w-100 d-flex flex-column flex-lg-row align-items-lg-center justify-content-lg-between"></div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4">
            <div>
                <span class="badge bg-success bg-opacity-10 text-success fw-bold px-3 py-1 rounded-pill mb-2">Check Log</span>
                <h2 class="fw-bold text-dark mb-0">Previous Plant Checks</h2>
            </div>
            <div class="mt-3 mt-md-0">
                <a href="detect.html" class="btn btn-agri-primary"><i class="fas fa-camera me-1"></i>Check New Plant</a>
            </div>
        </div>

        <div id="alertMessage" class="d-none"></div>

        <!-- Empty State -->
        <div id="emptyHistoryState" class="d-none card border-0 shadow-sm rounded-4 p-5 text-center bg-white">
            <i class="fas fa-folder-open text-muted display-4 mb-3"></i>
            <h4 class="fw-bold text-dark">No Previous Checks Found</h4>
            <p class="text-muted mb-4">You haven't checked any plant leaves yet.</p>
            <div>
                <a href="detect.html" class="btn btn-agri-primary btn-lg"><i class="fas fa-camera me-2"></i>Check Your First Plant</a>
            </div>
        </div>

        <!-- Desktop Table View -->
        <div id="historyTableContainer" class="table-responsive d-none d-md-block history-table">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Crop / Plant</th>
                        <th>Detected Disease</th>
                        <th>AI Confidence</th>
                        <th class="text-end">Action</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>

        <!-- Mobile Card View -->
        <div id="mobileHistoryCards" class="row">
            <!-- Loaded dynamically on small screens -->
        </div>

    </div>

    <footer>
        <div class="container text-center">
            <h5 class="fw-bold text-success"><i class="fas fa-leaf me-2"></i>AI Plant Disease Detection System</h5>
            <p class="text-muted small">&copy; 2026 College Project Demonstration</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
